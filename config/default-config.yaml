version: '1.0.0'

colors:
  text: '#1a1a1a' # Near-black (21:1 contrast with white)
  textMuted: '#666666' # Gray (5.7:1 contrast with white)
  headings: '#000000' # Black (21:1 contrast with white)
  links: '#0066cc' # Accessible blue (7.8:1 contrast with white)
  linksHover: '#004499' # Darker blue on hover
  background: '#ffffff' # White
  tableHeader: '#f5f5f5' # Light gray
  tableRowAlt: '#fafafa' # Slightly lighter gray
  focus: '#0066cc' # Same as links (keyboard focus)

typography:
  fontFamily: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
  baseFontSize: 16
  baseLineHeight: 1.6
  scaleH1: 2.5 # 40px
  scaleH2: 2.0 # 32px
  scaleH3: 1.5 # 24px
  scaleH4: 1.25 # 20px
  fontWeightNormal: 400
  fontWeightBold: 700
  fontWeightHeadings: 600

spacing:
  xs: 4
  sm: 8
  md: 16
  lg: 24
  xl: 32
  xxl: 48

breakpoints:
  tiny: 375
  small: 768
  medium: 992
  landscape: 1024
  large: 1200

tables:
  borderColor: '#dddddd'
  borderWidth: 1
  cellPadding: 12
  headerBackground: '#f5f5f5'
  headerTextColor: '#1a1a1a'
  stripedRows: true
  mobileScrollable: true
  # Interactive features (disabled by default)
  hoverHighlight: false
  hoverColor: '#f0f0f0'
  # Visual enhancements (disabled by default)
  roundedCorners: false
  borderRadius: 0
  # Mobile optimizations (disabled by default)
  compactMobile: false
  mobilePadding: 8
  responsiveStacking: false

bem:
  baseClass: 'text-block'
  variantClass: 'privacy-notice-content'
